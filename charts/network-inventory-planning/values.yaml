# Default values for network-inventory-planning.

replicaCount: 1

image:
  repository: claudioed/network-inventory-planning
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), mirroring the fleet convention
# (order-management ADR-0026 / inventory-storage). Disabled by default so
# merging this chart cannot silently change replica behaviour; the fleet
# turns it on deliberately later.
#
# NOTE on scaling this service: the process is a Kafka consumer group member
# under each STABLE, SHARED group id below (cmd/network-inventory-planning/
# main.go's startConsumers) -- N replicas share each topic's partitions via
# normal Kafka rebalancing, which is safe, but the consumers only exist at
# all when their group env var is set (each group id is its own off switch).
# Keep maxReplicas modest: ordering per aggregate is preserved by partition
# key, and a wider fan-out buys little for an idempotent
# processed-events-deduped read-model workload.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# deployment.environment.name on every span, metric and log this service
# exports. Set per-cluster (local / staging / production).
# Additive, disabled-by-default routing, same shape as every other chart in this
# fleet. warehouse-infra turns on exactly one of them (Gateway API when
# var.deploy_gateway_api, else the Kong ingress) and supplies the path.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: network-inventory-planning.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

environment: "local"

config:
  httpAddr: ":8080"
  # Fail-closed freshness budget of the planning snapshot;
  # PLANNING_MAX_STALENESS (Go duration, default 10m in the binary).
  maxStaleness: ""
  # ADR 0005 work-release configuration. transferPickPathId deliberately
  # has no default: the pick leg's path is site-specific and an unset
  # TRANSFER_PICK_PATH_ID makes POST /v1/transfers:approve answer 503
  # config-incomplete (fail-closed) rather than minting transfers whose
  # pick demand could never be released.
  transferPickPathId: ""
  transferPickCptOffset: ""
  transferDispatchPathId: ""
  transferDispatchCptOffset: ""
  # Transactional-outbox relay (ADR 0002 saga). "true" starts the
  # background relay draining outbox_events onto Kafka; empty leaves rows
  # durably parked for a later relay (approval still writes them).
  outboxRelayEnabled: "true"

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres DSN used only by the golang-migrate startup step (the runtime
  # pgxpool always uses existingSecretKey). Rendered with optional: true.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# Kafka wiring. The five consumer-group env vars are each their own off
# switch: an EMPTY value means that consumer does not run (the binary has
# NO defaults on purpose -- a default would let a locally run process join
# the live cluster's group and steal its partitions). Set the group ids
# only for the deployment that owns them.
kafka:
  enabled: false
  brokers: "kafka:9092"
  # Group ids deliberately default EMPTY; fill per environment.
  siteCapabilityConsumerGroup: ""
  siteSkuDemandConsumerGroup: ""
  capacityPlanConsumerGroup: ""
  transferReplyConsumerGroup: ""
  transferFactConsumerGroup: ""

extraEnv: []

# --- MCP server ---
# The Model Context Protocol server (cmd/mcp, Streamable HTTP only). DISABLED
# by default. Enabling it renders its own Deployment + Service (component=mcp)
# over the same OLTP database, served at "/" and "/mcp" with GET /healthz
# probes, command /app/mcp. Env names in templates/mcp-deployment.yaml match
# cmd/mcp/main.go. It starts no outbox relay, no Kafka consumer and dials no
# Kafka. Every tool is READ-ONLY (get_transfer, list_transfers,
# find_stuck_transfers, simulate_transfer_options): approving a transfer stays
# an operator action on the REST API. No auth / API key: MCP servers are
# unauthenticated fleet-wide (the ClusterIP boundary is the access control).
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  # Directory of the SQL migrations inside the image (the Dockerfile copies
  # them to /app/migrations); cmd/mcp applies them idempotently on start.
  migrationsPath: "migrations"
  logLevel: "info"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- console remote (ADR 0010) -----------------------------------------------
# An OPTIONAL nginx pod that serves the nip_mfe Module Federation remote (web/)
# as static bytes. DISABLED by default and entirely absent from the rendered
# manifest. ClusterIP only and with NO Ingress/HTTPRoute here: the Nginx web
# gateway in warehouse-infra is the single host-exposed frontend endpoint and
# routes /mfes/network-inventory-planning/ to this Service; Kong serves APIs
# only. The image is built from web/Dockerfile and is side-loaded in kind
# (never pulled), so keep pullPolicy IfNotPresent.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/network-inventory-planning-frontend
    pullPolicy: IfNotPresent
    # Empty = the chart's appVersion. warehouse-infra overrides it with a
    # content-derived local-<hash> tag.
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Covers the golang-migrate startup step (the pod refuses to boot until
# migrations apply): failureThreshold * periodSeconds = 60s of headroom
# before liveness probing begins.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

# Graceful shutdown budget: the HTTP Shutdown drain window (10s) plus the
# consumer-group Leave/outbox relay stop window plus margin for the
# readinessProbe's periodSeconds=5 to observe the flip.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
